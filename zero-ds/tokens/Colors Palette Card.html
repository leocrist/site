<!-- @dsCard group="Colors" viewport="880x720" name="Base palette" subtitle="Full tonal ramps — the raw colours semantic tokens draw from" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zero GEL — Base palette</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body {
    margin: 0;
    padding: 36px 40px;
    background: var(--zero-bg-system-secondary, #FFFFFF);
    color: var(--zero-text-primary, #022034);
    font-family: var(--zero-font-family);
  }
  .ramp {
    display: grid;
    grid-template-columns: 96px 1fr;
    align-items: center;
    gap: 16px;
    margin: 0 0 12px 0;
  }
  .ramp .fam {
    font: var(--zero-weight-medium) 13px/1.3 var(--zero-font-family);
    color: var(--zero-text-primary, #022034);
    text-transform: capitalize;
  }
  .steps {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 0;
    border-radius: var(--zero-radius-input, 4px);
    overflow: hidden;
    border: 1px solid var(--zero-border-subtle, #ECF0F3);
  }
  .cell {
    height: 52px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 6px 7px;
  }
  .cell .s { font-family: var(--zero-font-mono); font-size: 9.5px; line-height: 1; opacity: 0.9; }
  .cell .h { font-family: var(--zero-font-mono); font-size: 8.5px; line-height: 1.3; opacity: 0.7; text-transform: uppercase; }
</style>
</head>
<body>
  <div id="ramps"></div>
  <script>
    const families = {
      blue:      [10,30,50,100,150,200,300],
      green:     [0,10,30,50,100,150,200,300],
      turquoise: [10,30,50,100,150,200,300],
      yellow:    [10,30,50,100,150,200,300],
      orange:    [10,30,50,100,150,200,300],
      red:       [10,30,50,100,150,200,300],
      'warm-red':[10,30,50,100,150,200,300],
      magenta:   [10,30,50,100,150,200,300],
      purple:    [10,30,50,100,150,200,300],
      violet:    [10,30,50,100,150,200,300],
    };
    const neutrals = [
      ['grey-10','--base-colours-neutrals-grey-10'],
      ['grey-30','--base-colours-neutrals-grey-30'],
      ['grey-50','--base-colours-neutrals-grey-50'],
      ['grey-100','--base-colours-neutrals-grey-100'],
      ['grey-200','--base-colours-neutrals-grey-200'],
      ['ob-100','--base-colours-neutrals-off-black-100'],
      ['ob-200','--base-colours-neutrals-off-black-200'],
    ];
    const root = getComputedStyle(document.documentElement);
    const toHex = (rgb) => {
      const m = rgb.match(/\d+/g); if(!m) return rgb;
      return '#' + m.slice(0,3).map(n => (+n).toString(16).padStart(2,'0')).join('').toUpperCase();
    };
    const lum = (rgb) => { const m = rgb.match(/\d+/g).map(Number); return (0.299*m[0]+0.587*m[1]+0.114*m[2]); };
    const wrap = document.getElementById('ramps');

    function ramp(label, entries) {
      const row = document.createElement('div'); row.className = 'ramp';
      const fam = document.createElement('div'); fam.className = 'fam'; fam.textContent = label;
      const steps = document.createElement('div'); steps.className = 'steps';
      for (const [step, varName] of entries) {
        const val = root.getPropertyValue(varName).trim();
        if (!val) continue;
        const cell = document.createElement('div'); cell.className = 'cell';
        cell.style.background = val;
        const ink = lum(val) > 150 ? '#022034' : '#FFFFFF';
        cell.style.color = ink;
        cell.innerHTML = '<span class="s">'+step+'</span><span class="h">'+toHex(val)+'</span>';
        steps.appendChild(cell);
      }
      row.appendChild(fam); row.appendChild(steps); wrap.appendChild(row);
    }

    for (const [fam, steps] of Object.entries(families)) {
      if (!steps) continue;
      const entries = steps.map(s => [s, '--base-colours-'+fam+'-'+fam+'-'+s]);
      ramp(fam.replace('-', ' '), entries);
    }
    ramp('neutrals', neutrals);
  </script>
</body>
</html>
