<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zero GEL — Brand</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body {
    margin: 0;
    padding: 36px 40px;
    background: var(--zero-bg-system-secondary, #FFFFFF);
    color: var(--zero-text-primary, #022034);
    font-family: var(--zero-font-family);
  }
  h2.group {
    font: var(--zero-weight-medium) 11.2px/1.4 var(--zero-font-family);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--zero-text-tertiary, #596983);
    margin: 0 0 16px 0;
  }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .panel {
    border: 1px solid var(--zero-border-subtle, #ECF0F3);
    border-radius: var(--zero-radius-card, 8px);
    padding: 28px;
  }
  /* logo lockup */
  .lockup { display: flex; align-items: center; gap: 4px; }
  .lockup .word {
    font: var(--zero-weight-bold) 46px/1 var(--zero-font-family);
    letter-spacing: -0.01em;
    color: var(--zero-text-primary, #022034);
  }
  .lockup svg { width: 44px; height: 44px; display: block; }
  .lockup .o { color: var(--zero-logo-zero, #F9D51A); }
  .gel { display: flex; flex-direction: column; gap: 5px; margin-left: 12px; }
  .gel .dash { width: 30px; height: 5px; border-radius: 3px; background: var(--zero-logo-line, #DC67CE); }
  .gel .gel-word { font: var(--zero-weight-medium) 17px/1 var(--zero-font-family); letter-spacing: 0.16em; color: var(--zero-text-secondary, #273957); }
  .caption { font-family: var(--zero-font-mono); font-size: 10.5px; color: var(--zero-text-tertiary, #596983); margin: 22px 0 0; }

  /* brand colours */
  .brand-colors { display: flex; gap: 18px; }
  .bc { text-align: center; }
  .bc .sw { width: 84px; height: 84px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.06); margin-bottom: 10px; }
  .bc .name { font-size: 12.5px; font-weight: 500; margin: 0; }
  .bc .hex { font-family: var(--zero-font-mono); font-size: 10.5px; color: var(--zero-text-tertiary, #596983); margin: 2px 0 0; text-transform: uppercase; }

  /* icons */
  .icons { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
  .icon {
    width: 88px; height: 88px;
    border: 1px solid var(--zero-border-subtle, #ECF0F3);
    border-radius: var(--zero-radius-card, 8px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: var(--zero-text-primary, #022034);
  }
  .icon svg { display: block; }
  .icon span { font-family: var(--zero-font-mono); font-size: 10px; color: var(--zero-text-tertiary, #596983); }
</style>
</head>

            <div class="dash"></div>
            <span class="gel-word">GEL</span>
          </div>
        </div>
        <p class="caption">Yellow zero mark · magenta indicator dash</p>
      </div>
    </div>

    <div>
      <h2 class="group">Brand colours</h2>
      <div class="panel">
        <div class="brand-colors">

      </div>
    </div>
