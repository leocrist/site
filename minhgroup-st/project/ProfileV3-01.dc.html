<style>
body{margin:0}


/* ---------- design tokens ---------- */
:root{
  --b:0mm;                                  /* bleed */
  --navy:#201E1D;--navy-2:#2A2725;--navy-3:#3A3633;
  --blue:#CA4D25;--blue-l:#EF7A52;--blue-s:#FDF1EB;
  --green:#A93D1B;--green-l:#F2A07E;--green-s:#F6DFD3;
  --slate:#3A3633;--mut:#5C5C5C;--line:#EBE7E3;--off:#FAF7F4;--white:#FFFFFF;
  --head:'Plus Jakarta Sans',sans-serif;--body:'Be Vietnam Pro',sans-serif;
  --cw:11.3333mm;--gut:4mm;--step:15.3333mm;   /* 12-col grid inside 180mm safe width */
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--slate);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:calc(210mm + 2*var(--b));height:calc(297mm + 2*var(--b));position:relative;overflow:hidden;background:var(--white);break-after:page}
.page.navy{background:var(--navy);color:#fff}
.page.off{background:var(--off)}
.trim{position:absolute;left:var(--b);top:var(--b);width:210mm;height:297mm}
.a{position:absolute}
/* grid column helper: --c start col (1-12), --s span */
.gx{position:absolute;left:calc(15mm + (var(--c) - 1)*var(--step));width:calc(var(--s)*var(--step) - var(--gut))}
.bleed-l{left:calc(-1*var(--b))!important}
.full{left:calc(-1*var(--b));width:calc(210mm + 2*var(--b))}

/* ---------- type ---------- */
.lbl,.display,.h1,.h2,.h3,.stat,.chip,.pn{word-spacing:.09em}
.lbl{font-family:var(--head);font-size:6.8pt;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.display{font-family:var(--head);font-weight:800;font-size:42pt;line-height:1.04;letter-spacing:-.03em}
.h1{font-family:var(--head);font-weight:800;font-size:25pt;line-height:1.1;letter-spacing:-.025em;color:var(--navy)}
.navy .h1{color:#fff}
.h2{font-family:var(--head);font-weight:800;font-size:16pt;line-height:1.18;letter-spacing:-.02em;color:var(--navy)}
.h3{font-family:var(--head);font-weight:700;font-size:11pt;line-height:1.3;letter-spacing:-.01em;color:var(--navy)}
.navy .h2,.navy .h3,.on-navy .h2,.on-navy .h3{color:#fff}
.body{font-size:9.5pt;line-height:1.45}
.sm{font-size:9pt;line-height:1.42}
.xs{font-size:7.6pt;line-height:1.4}
.mut{color:var(--mut)}
.navy .mut,.on-navy .mut{color:#A39D98}
.stat{font-family:var(--head);font-weight:800;font-size:46pt;line-height:.95;letter-spacing:-.04em;color:var(--navy)}
.stat em{font-style:normal;color:var(--blue)}
.ic{width:5.2mm;height:5.2mm;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icb{width:9mm;height:9mm;border-radius:50%;display:grid;place-items:center;flex:none}
.blue-t{color:var(--blue)}.green-t{color:var(--green)}.navy-t{color:var(--navy)}
.card{border-radius:2.4mm;padding:5mm}
.chip{display:inline-flex;align-items:center;gap:1.6mm;font-family:var(--head);font-weight:700;font-size:7pt;border-radius:10mm;padding:1.2mm 3mm}
.row{display:flex;gap:3mm;align-items:flex-start}
.hr{height:.25mm;background:var(--line)}
/* running header/footer (inside trim, safe area) */
.rh{left:15mm;right:15mm;top:11mm;display:flex;justify-content:space-between;align-items:center}
.rf{left:15mm;right:15mm;bottom:9mm;display:flex;justify-content:space-between;align-items:center;font-size:6.6pt;letter-spacing:.06em}
.dot{display:inline-block;width:1.4mm;height:1.4mm;border-radius:50%;background:var(--green-l);margin:0 2.4mm;vertical-align:middle}
.pn{font-family:var(--head);font-weight:800;font-size:9pt;letter-spacing:0}

</style>
