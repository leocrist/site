/* ---------- tokens (swap these 6 to re-theme) ---------- */
:root{

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:calc(210mm + 2*var(--b));height:calc(297mm + 2*var(--b));position:relative;overflow:hidden;background:var(--paper);break-after:page}
.page.tint{background:var(--tint)}
.page.ink{background:var(--ink);color:var(--paper)}
.trim{position:absolute;left:var(--b);top:var(--b);width:210mm;height:297mm}
.a{position:absolute}
.bleedL{left:calc(-1*var(--b))}.bleedR{right:calc(-1*var(--b))}.bleedT{top:calc(-1*var(--b))}.bleedB{bottom:calc(-1*var(--b))}

/* type */
.cap{font-family:var(--head);font-weight:700;font-size:6.6pt;letter-spacing:.24em;text-transform:uppercase}
.wide{font-family:var(--head);font-weight:800;letter-spacing:.32em;text-transform:uppercase;line-height:1.12}
.h1{font-family:var(--head);font-weight:700;font-size:19pt;line-height:1.18;letter-spacing:-.005em}
.h2{font-family:var(--head);font-weight:700;font-size:12.5pt;line-height:1.25}
.h3{font-family:var(--head);font-weight:700;font-size:9.6pt;line-height:1.3}
.body{font-size:9.2pt;line-height:1.5}
.sm{font-size:8.4pt;line-height:1.45}
.xs{font-size:7pt;line-height:1.4}
.mut{color:var(--mut)}
.ink .mut{color:#C9BDBA}
.red-t{color:var(--red)}
.num{font-family:var(--head);font-weight:800;color:var(--red);letter-spacing:-.01em;line-height:1}
.ic{width:5mm;height:5mm;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dotc{width:11mm;height:11mm;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:10pt;flex:none}
.rule{height:.25mm;background:var(--line)}
.ink .rule{background:rgba(255,253,252,.18)}

/* duotone photo */
.duo{overflow:hidden}
.duo img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.12) brightness(1.06)}
.duo::after{content:"";position:absolute;inset:0;background:var(--red);mix-blend-mode:multiply;opacity:.9}
.duo.deep::before{content:"";position:absolute;inset:0;background:var(--red-d);opacity:.35;z-index:1}
.ph{overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.credit{position:absolute;font-size:4.6pt;color:#fff;background:rgba(43,36,36,.5);padding:.4mm 1.3mm;z-index:3}

/* footer: page number + centre tick (from the reference) */
.tick{left:calc(105mm - .9mm);bottom:calc(-1*var(--b));width:1.8mm;height:calc(9mm + var(--b));background:var(--red)}
.ticks{left:calc(105mm - 6mm);bottom:calc(-1*var(--b));width:12mm;height:calc(5mm + var(--b));display:flex;gap:1.2mm;justify-content:center;align-items:flex-end}
.ticks i{display:block;width:1.2mm;height:100%;background:var(--line)}
.pn{bottom:8mm;font-family:var(--head);font-weight:700;font-size:7pt;letter-spacing:.2em;color:var(--mut)}
.dots{background-image:radial-gradient(currentColor .32mm,transparent .36mm);background-size:2.6mm 2.6mm}

</style>
